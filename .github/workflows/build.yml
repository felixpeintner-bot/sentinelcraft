name: Jar bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sentinelcraft-jar
          path: build/libs/*.jar
